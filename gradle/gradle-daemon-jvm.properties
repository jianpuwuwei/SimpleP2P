# Gradle 守护进程 JVM 的条件（Gradle 8.8+ 的 "Daemon JVM criteria"）。
#
# 为什么要固定成 21：
#   fabric-loom 会检查运行 Gradle 的 JVM 版本是否满足目标 MC 的要求
#   （检查的是 JavaVersion.current()，不是编译用的 toolchain），
#   MC 1.21.1 要求 Java 21，所以守护进程必须跑在 21 上。
#   而 MC 1.20.1 只要求 Java 17（下限），21 一样满足，
#   各模块自身的 source/target 仍由各自的 java toolchain 决定（1.20.1 用 17，1.21.1 用 21）。
#
# 只按版本匹配（不限定厂商），Gradle 会从本机已安装的 JDK 里挑一个 21。
toolchainVersion=21
